<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저녁 체감 피드백 · 오늘옷 와이어프레임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1f1f}a:hover{color:#000}
</style>
<style>html{background:#e6e6e6}body>div{margin:24px auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px; word-break: keep-all">

  <div style="display: flex; align-items: center; gap: 8px; height: 44px">
    <a href="06-today-timeline.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 15px; color: #5c5c5c">11월 14일 금요일 · 저녁</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.35">오늘 입은 옷,<br>어땠어요?</h1>
    <p style="margin: 0; font-size: 15px; color: #5c5c5c">오늘 추천: 맨투맨 + 얇은 바람막이</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 18px; border-radius: 16px; border: 2px solid #1f1f1f; background: #f0f0f0; font: inherit; font-size: 17px; font-weight: 900; color: #1f1f1f">추웠어요<span style="font-size: 13px; font-weight: 700">선택됨</span></button>
    <button style="display: flex; align-items: center; min-height: 64px; padding: 0 18px; border-radius: 16px; border: 1px solid #cfcfcf; background: #ffffff; font: inherit; font-size: 17px; font-weight: 700; color: #1f1f1f">딱 좋았어요</button>
    <button style="display: flex; align-items: center; min-height: 64px; padding: 0 18px; border-radius: 16px; border: 1px solid #cfcfcf; background: #ffffff; font: inherit; font-size: 17px; font-weight: 700; color: #1f1f1f">더웠어요</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700">언제 그랬어요? (선택)</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button style="height: 44px; border-radius: 10px; border: 1px solid #cfcfcf; background: #ffffff; font: inherit; font-size: 15px; color: #1f1f1f">아침</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #cfcfcf; background: #ffffff; font: inherit; font-size: 15px; color: #1f1f1f">낮</button>
      <button style="height: 44px; border-radius: 10px; border: none; background: #1f1f1f; font: inherit; font-size: 15px; font-weight: 700; color: #ffffff">저녁</button>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 12px; background: #f0f0f0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.5"></path></svg>
    <span style="font-size: 14px; line-height: 1.5">다음부터 저녁 기온이 비슷한 날엔 한 겹 더 두껍게 추천할게요.</span>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="06-today-timeline.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">남기기</a>
</div>
</body>
</html>
