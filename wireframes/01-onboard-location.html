<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 1 · 동네 · 오늘옷 와이어프레임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1f1f}a:hover{color:#000}
</style>
<style>html{background:#e6e6e6}body>div{margin:24px auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px; word-break: keep-all">

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 12px">
    <span style="font-size: 13px; font-weight: 700; color: #5c5c5c">1 / 4</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #dcdcdc"></div>
      <div style="height: 4px; border-radius: 2px; background: #dcdcdc"></div>
      <div style="height: 4px; border-radius: 2px; background: #dcdcdc"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.35">어느 동네에서<br>하루를 보내요?</h1>
    <p style="margin: 0; font-size: 15px; color: #5c5c5c">학교나 집 근처 날씨로 알려드려요.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="loc" style="font-size: 13px; font-weight: 700">동네 검색</label>
    <input id="loc" type="text" value="가야동" style="height: 52px; box-sizing: border-box; border: 2px solid #1f1f1f; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 16px">
  </div>

  <div style="display: flex; flex-direction: column; border: 1px solid #cfcfcf; border-radius: 14px; overflow: hidden">
    <button style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 16px; border: none; border-bottom: 1px solid #e3e3e3; background: #f0f0f0; font: inherit; font-size: 15px; font-weight: 700; color: #1f1f1f; text-align: left">부산 부산진구 가야동<span style="font-size: 13px; font-weight: 700">선택됨</span></button>
    <button style="display: flex; align-items: center; min-height: 56px; padding: 0 16px; border: none; border-bottom: 1px solid #e3e3e3; background: #ffffff; font: inherit; font-size: 15px; color: #1f1f1f; text-align: left">부산 부산진구 가야1동</button>
    <button style="display: flex; align-items: center; min-height: 56px; padding: 0 16px; border: none; background: #ffffff; font: inherit; font-size: 15px; color: #1f1f1f; text-align: left">부산 부산진구 가야2동</button>
  </div>

  <button style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1px dashed #9a9a9a; border-radius: 14px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 700; color: #1f1f1f">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    현재 위치로 찾기
  </button>

  <div style="flex-grow: 1"></div>

  <a href="02-onboard-schedule.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">다음</a>
</div>
</body>
</html>
