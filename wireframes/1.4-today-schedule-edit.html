<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 일정 바꾸기 · 오늘옷 와이어프레임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1f1f}a:hover{color:#000}
</style>
<style>html{background:#e6e6e6}.states{display:flex;flex-wrap:wrap;justify-content:center;gap:40px;padding:24px 16px}.state{display:flex;flex-direction:column;gap:10px}.state>p{margin:0;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;color:#3d3d3d}</style>
</head>
<body>
<div class="states">

<!-- 기본 모습 -->
<div class="state">
<p>기본</p>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px; word-break: keep-all">

  <div style="display: flex; align-items: center; gap: 8px; height: 44px">
    <a href="06-today-timeline.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 15px; color: #5c5c5c">11월 14일 금요일 · 오늘</span>
  </div>

  <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.35">오늘 일정</h1>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700">지금 들어가 있는 일정</span>
    <div style="display: flex; flex-direction: column; border: 1px solid #cfcfcf; border-radius: 14px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 8px 0 16px; border-bottom: 1px solid #e3e3e3">
        <span style="font-size: 15px; font-weight: 700; flex-grow: 1">등교</span>
        <span style="font-size: 15px; padding: 6px 12px; border: 1px solid #1f1f1f; border-radius: 8px">08:30</span>
        <button aria-label="등교 일정 삭제" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 8px 0 16px">
        <span style="font-size: 15px; font-weight: 700; flex-grow: 1">귀가</span>
        <span style="font-size: 15px; padding: 6px 12px; border: 1px solid #1f1f1f; border-radius: 8px">18:00</span>
        <button aria-label="귀가 일정 삭제" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </div>
    <button style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 1px dashed #9a9a9a; border-radius: 14px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 700; color: #1f1f1f">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      일정 추가
    </button>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="06-today-timeline.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">저장하고 추천 다시 보기</a>
</div>
</div>

<!-- 오늘 일정이 하나도 없을 때 -->
<div class="state">
<p>오늘 일정이 하나도 없을 때</p>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px; word-break: keep-all">

  <div style="display: flex; align-items: center; gap: 8px; height: 44px">
    <a href="06-today-timeline.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 15px; color: #5c5c5c">11월 14일 금요일 · 오늘</span>
  </div>

  <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.35">오늘 일정</h1>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 16px; border: 1px dashed #9a9a9a; border-radius: 14px; text-align: center">
    <span style="font-size: 16px; font-weight: 700">오늘은 일정이 없어요</span>
    <span style="font-size: 14px; color: #5c5c5c; line-height: 1.5">밖에 있는 시간을 추가해 주세요.</span>
  </div>

  <button style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 1px dashed #9a9a9a; border-radius: 14px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 700; color: #1f1f1f">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    일정 추가
  </button>

  <div style="flex-grow: 1"></div>

  <a href="06-today-timeline.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">저장하고 추천 다시 보기</a>
</div>
</div>

</div>
</body>
</html>
