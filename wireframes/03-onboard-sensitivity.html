<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 3 · 추위 타는 정도 · 오늘옷 와이어프레임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1f1f}a:hover{color:#000}
</style>
<style>html{background:#e6e6e6}body>div{margin:24px auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px; word-break: keep-all">

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 12px">
    <span style="font-size: 13px; font-weight: 700; color: #5c5c5c">3 / 4</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #dcdcdc"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.35">추위를 얼마나<br>타는 편이에요?</h1>
    <p style="margin: 0; font-size: 15px; color: #5c5c5c">처음 기준만 정해요. 쓰면서 남긴 체감으로 조금씩 맞춰 갈게요.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 18px; border-radius: 16px; border: 2px solid #1f1f1f; background: #f0f0f0; font: inherit; color: #1f1f1f; text-align: left">
      <span style="font-size: 17px; font-weight: 900">추위를 많이 타요</span>
      <span style="font-size: 14px; color: #3d3d3d">친구들이 반팔일 때 후드티를 입어요</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 18px; border-radius: 16px; border: 1px solid #cfcfcf; background: #ffffff; font: inherit; color: #1f1f1f; text-align: left">
      <span style="font-size: 17px; font-weight: 700">보통이에요</span>
      <span style="font-size: 14px; color: #5c5c5c">대부분 친구들과 비슷하게 입어요</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 18px; border-radius: 16px; border: 1px solid #cfcfcf; background: #ffffff; font: inherit; color: #1f1f1f; text-align: left">
      <span style="font-size: 17px; font-weight: 700">더위를 많이 타요</span>
      <span style="font-size: 14px; color: #5c5c5c">남들보다 한 겹 얇게 입는 편이에요</span>
    </button>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="04-onboard-notify.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">다음</a>
</div>

</html>
