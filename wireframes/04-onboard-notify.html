<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 4 · 알림 시간 · 오늘옷 와이어프레임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1f1f}a:hover{color:#000}
</style>
<style>html{background:#e6e6e6}body>div{margin:24px auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px; word-break: keep-all">

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 12px">
    <span style="font-size: 13px; font-weight: 700; color: #5c5c5c">4 / 4</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.35">언제 옷을 정해요?</h1>
    <p style="margin: 0; font-size: 15px; color: #5c5c5c">하루 한 번, 정한 시간에 알려드려요.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; border-radius: 16px; border: 2px solid #1f1f1f; background: #f0f0f0; font: inherit; color: #1f1f1f; text-align: left">
      <span style="font-size: 17px; font-weight: 900">전날 밤</span>
      <span style="font-size: 14px; color: #3d3d3d">내일 날씨로 미리 꺼내 둬요</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; border-radius: 16px; border: 1px solid #cfcfcf; background: #ffffff; font: inherit; color: #1f1f1f; text-align: left">
      <span style="font-size: 17px; font-weight: 700">아침</span>
      <span style="font-size: 14px; color: #5c5c5c">오늘 날씨로 바로 골라요</span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <label for="time" style="font-size: 13px; font-weight: 700">알림 시간</label>
    <input id="time" type="text" value="밤 10:00" style="height: 52px; box-sizing: border-box; border: 2px solid #1f1f1f; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 18px; font-weight: 700">
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 14px; border: 1px dashed #9a9a9a">
    <span style="font-size: 14px; font-weight: 700">알림 미리보기</span>
    <span style="font-size: 14px; line-height: 1.5; color: #3d3d3d">"내일은 맨투맨 + 바람막이. 저녁엔 꼭 다시 입기"</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #5c5c5c; text-align: center">완료를 누르면 브라우저가 알림 허용을 물어봐요</span>
    <a href="05-notice.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">알림 받고 시작하기</a>
  </div>
</div>
</body>
</html>
