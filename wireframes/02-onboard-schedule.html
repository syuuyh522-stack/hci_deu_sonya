<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 2 · 평소 일정 · 오늘옷 와이어프레임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1f1f}a:hover{color:#000}
</style>
<style>html{background:#e6e6e6}body>div{margin:24px auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 20px; word-break: keep-all">

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 12px">
    <span style="font-size: 13px; font-weight: 700; color: #5c5c5c">2 / 4</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #1f1f1f"></div>
      <div style="height: 4px; border-radius: 2px; background: #dcdcdc"></div>
      <div style="height: 4px; border-radius: 2px; background: #dcdcdc"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.35">밖에 있는 시간을<br>알려주세요</h1>
    <p style="margin: 0; font-size: 15px; color: #5c5c5c">그 시간 날씨로 추천해요. 건너뛰면 아침·낮·저녁 기본 시간으로 알려드려요.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700">요일</span>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <button style="height: 44px; border-radius: 10px; border: none; background: #1f1f1f; color: #ffffff; font: inherit; font-size: 14px; font-weight: 700">월</button>
      <button style="height: 44px; border-radius: 10px; border: none; background: #1f1f1f; color: #ffffff; font: inherit; font-size: 14px; font-weight: 700">화</button>
      <button style="height: 44px; border-radius: 10px; border: none; background: #1f1f1f; color: #ffffff; font: inherit; font-size: 14px; font-weight: 700">수</button>
      <button style="height: 44px; border-radius: 10px; border: none; background: #1f1f1f; color: #ffffff; font: inherit; font-size: 14px; font-weight: 700">목</button>
      <button style="height: 44px; border-radius: 10px; border: none; background: #1f1f1f; color: #ffffff; font: inherit; font-size: 14px; font-weight: 700">금</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #cfcfcf; background: #ffffff; color: #5c5c5c; font: inherit; font-size: 14px">토</button>
      <button style="height: 44px; border-radius: 10px; border: 1px solid #cfcfcf; background: #ffffff; color: #5c5c5c; font: inherit; font-size: 14px">일</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700">밖에 있는 시간</span>
    <div style="display: flex; flex-direction: column; border: 1px solid #cfcfcf; border-radius: 14px; overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 16px; border-bottom: 1px solid #e3e3e3">
        <span style="font-size: 15px; font-weight: 700">등교</span>
        <span style="font-size: 15px; padding: 6px 12px; border: 1px solid #1f1f1f; border-radius: 8px">08:30</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 16px; border-bottom: 1px solid #e3e3e3">
        <span style="font-size: 15px; font-weight: 700">운동</span>
        <span style="font-size: 15px; padding: 6px 12px; border: 1px solid #1f1f1f; border-radius: 8px">17:00</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 56px; padding: 0 16px">
        <span style="font-size: 15px; font-weight: 700">귀가</span>
        <span style="font-size: 15px; padding: 6px 12px; border: 1px solid #1f1f1f; border-radius: 8px">22:00</span>
      </div>
    </div>
    <button style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 1px dashed #9a9a9a; border-radius: 14px; background: #ffffff; font: inherit; font-size: 15px; font-weight: 700; color: #1f1f1f">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      일정 추가 (실습, 약속 등)
    </button>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <a href="03-onboard-sensitivity.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none">다음</a>
    <a href="03-onboard-sensitivity.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; color: #3d3d3d">건너뛰기</a>
  </div>
</div>
</body>
</html>
