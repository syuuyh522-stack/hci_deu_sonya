<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 타임라인 · 오늘옷 와이어프레임</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f1f1f}a:hover{color:#000}
</style>
<style>html{background:#e6e6e6}body>div{margin:24px auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: 'Noto Sans KR', sans-serif; color: #1f1f1f; display: flex; flex-direction: column; padding: 20px 20px 24px; gap: 16px; word-break: keep-all">

  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 900">오늘옷</span>
      <span style="font-size: 13px; color: #5c5c5c">부산진구 가야동 · 11월 14일 금요일</span>
    </div>
    <button aria-label="설정" style="width: 44px; height: 44px; border: 1px solid #cfcfcf; border-radius: 12px; background: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
  </div>

  <div style="border: 2px solid #1f1f1f; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; font-weight: 700; color: #5c5c5c">오늘의 결론</span>
    <span style="font-size: 24px; font-weight: 900; line-height: 1.3">맨투맨 + 얇은 바람막이</span>
    <span style="font-size: 15px; color: #3d3d3d">낮엔 벗어도 되고, 저녁엔 꼭 다시 입어요</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 700; color: #5c5c5c">챙길 것</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: #1f1f1f; color: #ffffff">바람막이</span>
      <span style="font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; border: 1px solid #1f1f1f">우산 · 오후 3시부터 비</span>
      <span style="font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 999px; border: 1px dashed #9a9a9a; color: #5c5c5c">마스크 필요 없음</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 0; border: 1px solid #cfcfcf; border-radius: 16px; overflow: hidden">
    <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 72px; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #e3e3e3">
      <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">아침</span><span style="font-size: 12px; color: #5c5c5c">08:30 등교</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">맨투맨 + 바람막이</span><span style="font-size: 13px; color: #5c5c5c">쌀쌀해요</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 22px; font-weight: 900">11°</span><span style="font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #1f1f1f; color: #ffffff">입기</span></div>
    </div>
    <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 72px; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid #e3e3e3; background: #f5f5f5">
      <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">낮</span><span style="font-size: 12px; color: #5c5c5c">13:00 수업</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">바람막이 벗기</span><span style="font-size: 13px; color: #5c5c5c">맨투맨만으로 충분해요</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 22px; font-weight: 900">20°</span><span style="font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; border: 1px solid #1f1f1f">벗기</span></div>
    </div>
    <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 72px; gap: 12px; align-items: center; padding: 14px 16px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">저녁</span><span style="font-size: 12px; color: #5c5c5c">18:00 귀가</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">바람막이 다시 입기</span><span style="font-size: 13px; color: #5c5c5c">바람이 세서 더 춥게 느껴져요</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 22px; font-weight: 900">13°</span><span style="font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #1f1f1f; color: #ffffff">입기</span></div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #f0f0f0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17.5v.5"></path></svg>
    <span style="font-size: 14px; line-height: 1.5">비가 오후 3시부터 와요. 흰 운동화는 피하는 게 좋아요.</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; color: #5c5c5c; text-align: center">내 기준: 추위를 조금 타는 편 · 피드백 6번 반영</span>
    <a href="07-feedback.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; border: 1px solid #1f1f1f; font-size: 15px; font-weight: 700; text-decoration: none">오늘 어땠어요? 체감 남기기</a>
  </div>
</div>
</body>
</html>
